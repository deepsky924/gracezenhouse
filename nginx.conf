# Fingerprinted assets (?v=hash) are cached for a year; HTML is revalidated on every visit.
# Set via a map so no location needs its own add_header (which would drop the server-level ones).
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy: keep redirects relative so they stay on https.
    absolute_redirect off;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Retired pages from the previous site → closest current page.
    location = /home { return 301 /; }
    location = /terms { return 301 /; }
    location = /track { return 301 /; }
    location ~ ^/locations(/.*)?$ { return 301 /contact/; }
    location = /blog/anti-aging-facials-rancho-cucamonga { return 301 /services/facial-treatments/; }
    location = /blog/reiki-anti-aging { return 301 /services/reiki/; }
    location = /blog/dermaplaning-vs-microdermabrasion { return 301 /services/facial-treatments/dermaplaning-facial/; }
    location = /blog/brazilian-wax-aftercare { return 301 /services/waxing-services/brazilian-wax/; }
    location = /blog/facials-for-sensitive-skin { return 301 /services/facial-treatments/sensitive-skin-facial/; }
    location = /blog/hydrafacial-vs-oxygen-rx { return 301 /services/facial-treatments/hydrafacial/; }
    location = /blog/back-facial-benefits { return 301 /services/facial-treatments/customized-back-facial/; }
    location = /blog/mens-waxing-skincare { return 301 /services/waxing-services/; }
    location = /blog/led-light-therapy-anti-aging { return 301 /services/facial-treatments/brightening-facial-with-led/; }
    location = /blog/rancho-cucamonga-professionals-grace-zen { return 301 /; }
    location ~ ^/blog(/.*)?$ { return 301 /services/; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain;
}
